<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CarretoJá</title>
<meta name="theme-color" content="#F7F6F2">
<meta name="description" content="Orçamento de carreto justo, agenda e lucro real no celular.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#F7F6F2; --surface:#FFFDF8; --surface-2:#EFEDE6; --border:#E3E1DA; --border-strong:#C9C6BC;
  --text:#15181D; --muted:#5A6270; --faint:#8B919C;
  --brand:#F5B700; --brand-ink:#15181D; --brand-text:#8A6200; --brand-soft:#FFF1C2;
  --ink:#15181D; --ink-text:#F7F6F2; --ink-muted:#C9CDD3;
  --green:#1F7A44; --green-soft:#DDF1E4; --green-text:#145C32;
  --orange:#D9822B; --orange-soft:#FCEBD9; --orange-text:#8A4A0E;
  --red:#C2412D; --red-soft:#F9E1DC; --red-text:#8E2A1B;
  --grey-soft:#E6E4DD; --grey-text:#3D434E;
  --shadow:0 1px 2px rgba(21,24,29,.06),0 4px 16px rgba(21,24,29,.06);
  --radius:16px; --radius-sm:12px;
  --tiles:'light_all';
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --surface:#1B1E24; --surface-2:#22262E; --border:#2C313A; --border-strong:#3D434E;
    --text:#F2F1EC; --muted:#A3A9B3; --faint:#7D838D;
    --brand-text:#F5B700; --brand-soft:#3A3115;
    --ink:#22262E; --ink-text:#F2F1EC; --ink-muted:#C9CDD3;
    --green:#3DAA6A; --green-soft:#16301F; --green-text:#7FD3A0;
    --orange:#E39A4F; --orange-soft:#33240F; --orange-text:#F2B77A;
    --red:#E06A55; --red-soft:#3A1B16; --red-text:#F2A193;
    --grey-soft:#2C313A; --grey-text:#C9CDD3;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1B1E24; --surface-2:#22262E; --border:#2C313A; --border-strong:#3D434E;
  --text:#F2F1EC; --muted:#A3A9B3; --faint:#7D838D;
  --brand-text:#F5B700; --brand-soft:#3A3115;
  --ink:#22262E; --ink-text:#F2F1EC; --ink-muted:#C9CDD3;
  --green:#3DAA6A; --green-soft:#16301F; --green-text:#7FD3A0;
  --orange:#E39A4F; --orange-soft:#33240F; --orange-text:#F2B77A;
  --red:#E06A55; --red-soft:#3A1B16; --red-text:#F2A193;
  --grey-soft:#2C313A; --grey-text:#C9CDD3;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* ── header ── */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.2px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px;stroke:var(--brand-ink)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-weight:700;font-size:15px}

.view{padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.section-label{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ── cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-ink{background:var(--ink);color:var(--ink-text);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:4px}
.card-ink .muted{color:var(--ink-muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.value{font-size:28px;font-weight:700;letter-spacing:-.5px}
.value-xl{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.hr{height:1px;background:var(--border);margin:4px 0}

/* ── buttons ── */
.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-dark{background:var(--text);color:var(--bg)}
.btn-outline{border:1.5px solid var(--border-strong);color:var(--text);background:var(--surface)}
.btn-ghost{color:var(--muted);font-weight:600}
.btn-green{background:var(--green);color:#FFFDF8}
.btn-block{width:100%}
.btn-sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:12px}
.btn-on-ink{border:1.5px solid #5A6270;color:var(--ink-text)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.link-danger{color:var(--red-text);font-weight:600;font-size:15px;padding:12px 0;text-align:center;width:100%}

/* ── pills / status ── */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-orcado{background:var(--grey-soft);color:var(--grey-text)}
.st-agendado{background:var(--brand-soft);color:var(--brand-text)}
.st-feito{background:var(--orange-soft);color:var(--orange-text)}
.st-pago{background:var(--green-soft);color:var(--green-text)}
.st-recusado{background:var(--red-soft);color:var(--red-text)}

/* ── alerts ── */
.alert{border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%}
.alert-orange{background:var(--orange-soft);border-left:5px solid var(--orange)}
.alert-grey{background:var(--surface-2);border-left:5px solid var(--border-strong)}
.alert b{display:block}
.alert .act{font-weight:700;font-size:15px;white-space:nowrap}
.alert-orange .act{color:var(--orange-text)}

/* ── list items ── */
.item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.item-main{flex:1;min-width:0}
.item-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item-price{font-weight:700}
.time-badge{width:56px;flex-shrink:0;font-weight:700;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--border);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);margin-bottom:4px}

/* ── forms ── */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:16px;outline:none}
.input:focus{border-color:var(--brand)}
.input-affix{min-width:0;display:flex;align-items:center;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);min-height:48px;padding:0 14px;gap:8px}
.input-affix:focus-within{border-color:var(--brand)}
.input-affix input{border:none;outline:none;background:transparent;flex:1;min-width:0;font-size:16px;height:46px}
.input-affix span{color:var(--muted);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ── chips & steppers ── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--border-strong);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.stepper-row:last-child{border-bottom:none}
.stepper-row .lbl{font-weight:600}
.stepper-row .hint{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:700;display:grid;place-items:center}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:23px}

/* ── stops & autocomplete ── */
.stops{display:flex;flex-direction:column;gap:8px}
.stop{display:flex;align-items:center;gap:10px;position:relative}
.stop-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.dot-a{background:var(--green);color:#fff}
.dot-b{background:var(--text);color:var(--bg)}
.dot-w{background:var(--brand);color:var(--brand-ink)}
.stop .input{padding-right:40px}
.stop-x{position:absolute;right:6px;width:36px;height:36px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.stop-x svg{width:18px;height:18px}
.ac{position:absolute;left:38px;right:0;top:52px;z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.14);overflow:hidden;max-height:300px;overflow-y:auto}
.ac button{display:block;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--border)}
.ac button:last-child{border-bottom:none}
.ac b{display:block;font-weight:600;font-size:15px}
.ac span{font-size:13px;color:var(--muted)}
.add-stop{border:1.5px dashed var(--border-strong);border-radius:12px;min-height:44px;color:var(--muted);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.map{height:180px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
.map.big{height:240px}
.route-info{display:flex;gap:16px;font-weight:600;font-size:15px}
.status-msg{font-size:14px;font-weight:600}
.status-msg.err{color:var(--red-text)}

/* ── price bar ── */
.pricebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(520px,100%);padding:0 12px;z-index:25}
.pricebar-inner{background:var(--ink);color:var(--ink-text);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.pricebar .price{font-size:32px;font-weight:800;color:var(--brand);letter-spacing:-.5px;line-height:1}
.pricebar .profit{font-size:14px;font-weight:600;color:#7FD3A0}
.pricebar .profit.neg{color:#F2A193}
.pricebar .lbl{font-size:13px;color:var(--ink-muted)}
.pricebar-spacer{height:150px}
.breakdown{display:flex;flex-direction:column;gap:6px;font-size:15px}
.breakdown .row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.breakdown .total{font-weight:800;border-top:1px solid var(--border);padding-top:8px}

/* ── week strip ── */
.week{display:flex;justify-content:space-between;gap:4px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;min-height:64px}
.day small{font-size:12px;color:var(--muted);font-weight:600;text-transform:capitalize}
.day b{font-size:18px}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day i.has{background:var(--orange)}
.day.on{background:var(--brand);color:var(--brand-ink)}
.day.on small{color:var(--brand-ink)}
.day.on i.has{background:var(--brand-ink)}

/* ── bottom nav ── */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--faint);min-height:56px;justify-content:center}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--text)}
.nav .fab{flex:0 0 auto;width:60px;height:60px;border-radius:50%;background:var(--brand);color:var(--brand-ink);margin-top:-22px;box-shadow:0 6px 18px rgba(245,183,0,.45);min-height:0}
.nav .fab svg{width:30px;height:30px;stroke-width:2.5}

/* ── sheet ── */
.backdrop{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(520px,100%);max-height:90dvh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:60;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transition:transform .25s ease}
.sheet.open{transform:translate(-50%,0)}
.sheet-grip{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:4px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{font-size:20px;font-weight:800}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.sheet .stack{gap:12px}

/* ── toast ── */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;transition:all .2s;z-index:90;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── onboarding ── */
.onb{min-height:100dvh;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));gap:16px;max-width:520px;margin:0 auto}
.onb-steps{display:flex;gap:6px}
.onb-steps i{flex:1;height:4px;border-radius:2px;background:var(--border)}
.onb-steps i.on{background:var(--brand)}
.vehicles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vehicle{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:104px}
.vehicle svg{width:36px;height:36px;stroke:var(--text)}
.vehicle b{font-size:15px}
.vehicle span{font-size:13px;color:var(--muted)}
.vehicle.on{border-color:var(--brand);background:var(--brand-soft)}

/* ── client quote page ── */
.client-page{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 120px;display:flex;flex-direction:column;gap:14px}
.check-line{display:flex;align-items:center;gap:10px;font-size:16px}
.check-line svg{width:20px;height:20px;stroke:var(--green);flex-shrink:0}
.client-cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:8px}
.pix{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.pix code{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit;font-weight:600}

.leaflet-control-zoom a{color:var(--text)!important;background:var(--surface)!important;border-color:var(--border)!important}
.leaflet-control-attribution{font-size:10px!important}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="root"></div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="import-file" accept="application/json" class="hidden">

<script>

═════════════════════════════════════════════ */

let DB;
const Store = {
  load(){
    let db = null;
    try{ db = JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
    if(!db){ db = {settings:{...DEFAULT_SETTINGS}, clients:[], jobs:[], expenses:[]}; Store.migrate(db); }
    db.settings = {...DEFAULT_SETTINGS, ...db.settings};
    db.clients ||= []; db.jobs ||= []; db.expenses ||= [];

  },
  save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('Não consegui salvar no aparelho'); } },
  /* traz o histórico e o endereço da versão anterior do CarretoJá */
  migrate(db){
    try{
      const home = JSON.parse(localStorage.getItem('frete_home')||'null');
      if(home && home.label){ db.settings.base = {label:home.label, lat:+home.lat, lng:+home.lng}; }
      const old = JSON.parse(localStorage.getItem('cj_history')||'[]');
      old.forEach(h=>{
        const km = parseFloat(String(h.km||'').replace(',','.'))||0;
        const preco = +h.priceNum || parseFloat(String(h.price||'').replace(/[^\d,]/g,'').replace(',','.')) || 0;
        let cliId = null;

          if(!c){ c={id:uid(), nome:h.client, whatsapp:'', criado:today()}; db.clients.push(c); }
          cliId = c.id;
        }
        const created = parseBRDate(h.date) || today();
        db.jobs.push({
          id:uid(), code:code4(), clienteId:cliId, clienteNome:h.client||'',
          stops:(h.stops||[]).map(l=>({label:l})), km, durMin:0, horas:0, ajudantes:0, andares:0, desmontar:false, pedagio:0, ajuste:0,
          preco, custo:0, lucro:0, status: h.status==='done'?'feito':'orcado',
          data: h.status==='done'?created:'', hora:'', criado:created, validade:'', migrado:true,
        });
      });
      if(old.length || home) db.settings.onboarded = !!(home && home.label);
    }catch(e){}
  }
};
function parseBRDate(s){ const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m?`${m[3]}-${m[2]}-${m[1]}`:null; }
function code4(){ return Math.random().toString(36).slice(2,6).toUpperCase(); }
const S = () => DB.settings;

/* ═════════ cálculo do preço ═════════ */
function calcular(q, s=S()){
  const km = +q.km||0;
  const custoKm = (s.consumo>0 ? s.precoLitro/s.consumo : 0) + (+s.depr||0);
  const desloc = custoKm*km;
  const tempo = (+q.horas||0)*(+s.valorHora||0);
  const ajud = (+q.ajudantes||0)*(+s.ajudante||0);
  const escada = (+q.andares||0)*(+s.andar||0);
  const desm = q.desmontar ? (+s.desmontagem||0) : 0;
  const ped = +q.pedagio||0;
  const taxa = +s.taxaSaida||0;
  const base = desloc + taxa + tempo + ajud + escada + desm + ped;
  const comMargem = base*(1+(+s.margem||0)/100);
  let sugerido = comMargem;
  const minimoAplicado = sugerido < (+s.minimo||0);
  if(minimoAplicado) sugerido = +s.minimo;
  const step = +s.arredondar||0;
  if(step>0) sugerido = Math.ceil(sugerido/step)*step;
  const preco = Math.max(0, Math.round((sugerido + (+q.ajuste||0))*100)/100);
  const custo = desloc + ajud + ped; // o que sai do bolso no serviço
  const lucro = preco - custo;
  return {km, custoKm, desloc, tempo, ajud, escada, desm, ped, taxa, base, comMargem, sugerido, minimoAplicado, preco, custo, lucro};
}
function inclusos(j){
  const a=[];
  if(j.ajudantes>0) a.push(plural(j.ajudantes,'ajudante','ajudantes'));
  a.push('Carga e descarga');
  if(j.andares>0) a.push(`Escada: ${plural(j.andares,'andar','andares')}`);
  if(j.desmontar) a.push('Desmontagem e montagem');
  if(j.pedagio>0) a.push('Pedágio incluso');
  return a;
}

  return html;
}
function fmtPhone(p){ const d=digits(p).replace(/^55(?=\d{10,11}$)/,''); if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return p; }
function adjText(){ return Q.ajuste ? `Ajuste aplicado: ${Q.ajuste>0?'+':'−'}${R$(Math.abs(Q.ajuste))} · <button style="font-weight:700;color:var(--text)" onclick="Q.ajuste=0;refreshPrice()">desfazer</button>` : 'O preço já vem arredondado para cima. Ajuste se precisar.'; }
function stepperRow(key,label,hint,val,min,max,step,isHours){

}
function stepQ(key,d,min,max){

/* ─── API de mapas (trocar por Edge Function depois) ─── */
async function geocode(q){
  const hasCity = /jacare[ií]|sjc|s[ãa]o jos[ée]|campos|taubat[ée]|aparecida|guaratinguet[áa]|ca[çc]apava|santa branca|guararema|mogi/i.test(q);
  const out=[];
  try{
    const u=`https://api.openrouteservice.org/geocode/autocomplete?api_key=${ORS_KEY}&text=${encodeURIComponent(q)}&boundary.country=BR&focus.point.lat=${REGION.lat}&focus.point.lon=${REGION.lng}&size=6&lang=pt`;
    const d=await (await fetch(u)).json();
    (d.features||[]).forEach(f=>out.push(placeFromOrs(f)));
  }catch(e){}
  if(out.length<3){
    try{
      const nq = hasCity?q:q+', Jacareí SP';
      const u=`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(nq)}&countrycodes=br&limit=5&addressdetails=1&viewbox=-46.3,-23.0,-45.5,-23.6&accept-language=pt-BR`;
      const d=await (await fetch(u)).json();
      d.forEach(x=>{
        const a=x.address||{};
        const road=a.road||a.pedestrian||x.display_name.split(',')[0];
        const line1=a.house_number?`${road}, ${a.house_number}`:road;
        const line2=[a.suburb||a.neighbourhood||'', a.city||a.town||a.village||'', a.state||''].filter(Boolean).join(', ');
        if(!out.some(o=>o.line1===line1&&o.line2===line2)) out.push({line1,line2,label:[line1,line2].filter(Boolean).join(' — '),lat:+x.lat,lng:+x.lon});
      });
    }catch(e){}
  }
  return out.slice(0,6);
}
function placeFromOrs(f){
  const p=f.properties||{};
  const street=p.name||p.street||'';
  const line1=p.housenumber&&!street.includes(p.housenumber)?`${street}, ${p.housenumber}`:street;
  const line2=[p.neighbourhood||p.borough||'', p.locality||p.county||'', p.region_a||p.region||''].filter(Boolean).join(', ');
  return {line1,line2,label:[line1,line2].filter(Boolean).join(' — '),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]};
}
async function routeApi(coords){
  const res=await fetch('https://api.openrouteservice.org/v2/directions/driving-car/json',{method:'POST',headers:{'Authorization':ORS_KEY,'Content-Type':'application/json'},body:JSON.stringify({coordinates:coords,instructions:false,units:'km'})});
  const data=await res.json();
  if(!res.ok||!data.routes?.[0]) throw new Error(data.error?.message||'Rota não encontrada');
  const r=data.routes[0];
  return {km:+r.summary.distance.toFixed(1), durMin:Math.round(r.summary.duration/60), geometry:decodePolyline(r.geometry)};
}
function decodePolyline(enc){
  let i=0,lat=0,lng=0,out=[];
  while(i<enc.length){
    let b,sh=0,r=0; do{b=enc.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5;}while(b>=0x20); lat+=(r&1)?~(r>>1):(r>>1);
    sh=0;r=0; do{b=enc.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5;}while(b>=0x20); lng+=(r&1)?~(r>>1):(r>>1);
    out.push([lat/1e5,lng/1e5]);
  }
  return out;
}
async function calcRoute(){
  const pts=Q.stops.filter(s=>s.lat!=null&&s.lng!=null);
  const st=document.getElementById('route-status');
  if(pts.length<2 || pts.length!==Q.stops.length){ st.className='status-msg err'; st.textContent='Escolha cada endereço na lista de sugestões.'; return; }
  const btn=document.getElementById('btn-route'); btn.disabled=true; btn.textContent='Calculando…';
  try{
    const r=await routeApi(pts.map(s=>[s.lng,s.lat]));
    Q.km=r.km; Q.durMin=r.durMin; Q.coords=r.geometry; Q.routed=true;
    if(!Q.horasManual) Q.horas = Math.max(1, Math.ceil((r.durMin/60 + 1)*2)/2); // direção + 1h de carga/descarga
    render();
  }catch(e){
    btn.disabled=false; btn.innerHTML=`${ic('route')}Calcular rota`;
    st.className='status-msg err'; st.textContent = navigator.onLine ? 'Não consegui calcular a rota. Confira os endereços ou use "Digitar km".' : 'Sem internet. Use "Digitar km" e calcule depois.';
  }
}
let qMap=null;
function tileUrl(){ const dark = document.documentElement.dataset.theme==='dark' || (document.documentElement.dataset.theme!=='light' && matchMedia('(prefers-color-scheme: dark)').matches); return `https://{s}.basemaps.cartocdn.com/${dark?'dark_all':'rastertiles/voyager'}/{z}/{x}/{y}{r}.png`; }
function drawMap(el, coords, stops){
  if(!window.L || !el) return null;
  const m=L.map(el,{zoomControl:false,attributionControl:true,dragging:true,scrollWheelZoom:false});
  L.tileLayer(tileUrl(),{attribution:'© OpenStreetMap © CARTO',maxZoom:19}).addTo(m);
  const line = coords&&coords.length ? coords : stops.map(s=>[s.lat,s.lng]);
  const pl=L.polyline(line,{color:'#C99400',weight:5,opacity:.95,dashArray:coords&&coords.length?null:'6 10'}).addTo(m);
  stops.forEach((s,i)=>{
    const last=i===stops.length-1;
    const col=i===0?'#1F7A44':last?'#15181D':'#F5B700';
    const tx=i===0?'A':last?'B':String(i);
    L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:`<div style="width:30px;height:30px;border-radius:50%;background:${col};color:${col==='#F5B700'?'#15181D':'#fff'};display:grid;place-items:center;font:800 14px Inter,sans-serif;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">${tx}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(m);
  });
  m.fitBounds(pl.getBounds(),{padding:[28,28]});
  return m;
}
function initQuoteMap(){
  if(qMap){ try{qMap.remove();}catch(e){} qMap=null; }
  if(Q.mode!=='mapa'||!Q.routed) return;
  const el=document.getElementById('qmap'); if(!el) return;
  qMap=drawMap(el,Q.coords,Q.stops.filter(s=>s.lat!=null));
}

/* salvar / enviar */
function saveQuote(send){
  const r=calcular(Q);
  if(!(r.km>0)){ toast(Q.mode==='mapa'?'Calcule a rota antes de enviar':'Informe a distância em km'); return; }
  // cliente
  let cli = Q.clienteId ? DB.clients.find(c=>c.id===Q.clienteId) : null;
  const nome = (Q.clienteNome||'').trim();
  if(!cli && nome){
    cli = DB.clients.find(c=>c.nome.toLowerCase()===nome.toLowerCase());
    if(!cli){ cli={id:uid(), nome, whatsapp:digits(Q.clienteWpp), criado:today()}; DB.clients.push(cli); }
    else if(Q.clienteWpp && !cli.whatsapp) cli.whatsapp=digits(Q.clienteWpp);
  }
  if(send && !cli){ toast('Informe o nome do cliente'); document.getElementById('cli-name')?.focus(); return; }
  const validade = addDays(today(), +S().validade||7);
  const data = {
    clienteId:cli?.id||null, clienteNome:cli?.nome||nome,
    stops: Q.mode==='mapa' ? Q.stops.map(s=>({label:s.label,lat:s.lat,lng:s.lng})) : [],
    km:r.km, durMin:Q.durMin||0, horas:Q.horas, ajudantes:Q.ajudantes, andares:Q.andares, desmontar:Q.desmontar, pedagio:Q.pedagio, ajuste:Q.ajuste||0,
    preco:r.preco, custo:r.custo, lucro:r.lucro, data:Q.data||'', hora:Q.hora||'', validade,
  };
  let job;
  if(Q.editingId){ job=DB.jobs.find(j=>j.id===Q.editingId); Object.assign(job,data,{criado:today()}); delete job.migrado; }
  else { job={id:uid(), code:code4(), status:'orcado', criado:today(), ...data}; DB.jobs.push(job); }
  Store.save();
  if(send){
    const msg = quoteMessage(job);
    const phone = cli?.whatsapp;
    window.open(phone?waLink(phone,msg):`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  }
  toast(send?'Orçamento enviado e salvo':'Orçamento salvo');
  newQuote(); UI.tab='agenda'; UI.agendaMode='orcados'; render();
}
function quoteLink(j){
  const s=S();
  const payload = {v:1, id:j.code, n:s.negocio||s.nome, t:digits(s.telefone), p:s.pix, c:j.clienteNome,
    s:(j.stops||[]).map(x=>[shortPlace(x.label), x.lat!=null?+(+x.lat).toFixed(5):null, x.lng!=null?+(+x.lng).toFixed(5):null]),
    k:j.km, d:j.data, h:j.hora, i:inclusos(j), r:j.preco, val:j.validade};
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin + location.pathname + '#o=' + b64;
}
function quoteMessage(j){
  const s=S();
  const st=(j.stops||[]).filter(x=>x.label);
  const rota = st.length ? st.map(x=>shortPlace(x.label)).join(' → ') + ` (${fmtKm(j.km)})` : fmtKm(j.km);

  return lines.join('\n');
}

    h += `<div class="field"><label>Cliente aceitou? Marque a data</label><div class="grid2"><input class="input" type="date" id="jd" value="${j.data||today()}"><input class="input" type="time" id="jh" value="${j.hora||''}"></div></div>
      <button class="btn btn-primary btn-block" onclick="setStatus('${j.id}','agendado')">${ic('cal')}Aceito — agendar</button>
      <div class="btn-row"><button class="btn btn-outline" style="flex:1" onclick="reviseJob('${j.id}')">${ic('edit')}Reenviar</button>
      <button class="btn btn-outline" style="flex:1" onclick="setStatus('${j.id}','recusado')">Recusou</button></div>`;
  } else if(j.status==='agendado'){
    h += `<div class="btn-row"><a class="btn btn-dark" style="flex:1" href="${navUrl(j)}" target="_blank" rel="noopener">${ic('nav')}Navegar</a>
      ${c&&c.whatsapp?`<a class="btn btn-outline" style="flex:1" href="${waLink(c.whatsapp,`Olá, ${firstName(j.clienteNome)}! Confirmando o carreto ${j.data?fmtDay(j.data):''}${j.hora?' às '+j.hora:''}. Tudo certo?`)}" target="_blank" rel="noopener">${ic('wa')}Confirmar</a>`:''}</div>
      <button class="btn btn-primary btn-block" onclick="setStatus('${j.id}','feito')">${ic('check')}Serviço concluído</button>
      ${payButtons(j)}`;
  } else if(j.status==='feito'){
    h += `<div class="field"><label>Recebeu? Como foi pago</label></div>${payButtons(j,true)}
      ${c&&c.whatsapp?`<a class="btn btn-outline btn-block" href="${waLink(c.whatsapp,cobrancaMsg(j))}" target="_blank" rel="noopener">${ic('wa')}Enviar lembrete de pagamento</a>`:''}`;
  } else if(j.status==='pago' || j.status==='recusado'){
    h += `<button class="btn btn-outline btn-block" onclick="reviseJob('${j.id}',true)">${ic('plus')}Novo orçamento parecido</button>`;
  }
  if(c) h += `<button class="btn btn-ghost btn-block" onclick="openClient('${c.id}')">${ic('users')}Ver cliente</button>`;
  h += `<button class="link-danger" onclick="deleteJob('${j.id}')">Excluir este serviço</button></div>`;
  openSheet(h);
}
function payButtons(j, primary){
  return `<div class="btn-row">${['Pix','Dinheiro','Cartão'].map(f=>`<button class="btn ${primary?'btn-green':'btn-outline'}" style="flex:1" onclick="markPaid('${j.id}','${f}')">${primary?'':'Pago · '}${f}</button>`).join('')}</div>`;
}
function setStatus(id,st){
  const j=DB.jobs.find(x=>x.id===id); if(!j) return;
  if(st==='agendado'){ const d=document.getElementById('jd')?.value, h=document.getElementById('jh')?.value; if(!d){ toast('Escolha a data'); return; } j.data=d; j.hora=h||''; }
  if(st==='feito' && !j.data) j.data=today();
  j.status=st; Store.save(); closeSheet(); render();
  toast({agendado:'Agendado',feito:'Marcado como feito — falta receber',recusado:'Marcado como recusado'}[st]||'Atualizado');
}
function markPaid(id,forma){
  const j=DB.jobs.find(x=>x.id===id); if(!j) return;
  j.status='pago'; j.pagoEm=today(); j.forma=forma; if(!j.data) j.data=today();
  Store.save(); closeSheet(); render(); toast(`Recebido ${R$(j.preco)} · ${forma}`);
}
function deleteJob(id){ if(!confirm('Excluir este serviço? Isso não pode ser desfeito.')) return; DB.jobs=DB.jobs.filter(j=>j.id!==id); Store.save(); closeSheet(); render(); }
function reviseJob(id, asNew){
  const j=DB.jobs.find(x=>x.id===id); if(!j) return;
  const c=clientOf(j);
  const hasCoords = (j.stops||[]).length>=2 && j.stops.every(s=>s.lat!=null);
  newQuote({
    editingId: asNew?null:j.id, clienteId:c?.id||null, clienteNome:j.clienteNome||'', clienteWpp:c?.whatsapp||'',
    mode: hasCoords?'mapa':'manual', stops: hasCoords?j.stops.map(s=>({...s})):Q?.stops||[{label:''},{label:''}],
    km:j.km, durMin:j.durMin||0, routed:false, horas:j.horas||1, horasManual:true, ajudantes:j.ajudantes||0, andares:j.andares||0,
    desmontar:!!j.desmontar, pedagio:j.pedagio||0, ajuste:0, data:asNew?'':(j.data||''), hora:asNew?'':(j.hora||''),
  });
  if(!hasCoords){ Q.stops=[S().base?{...S().base}:{label:''},{label:''}]; }
  closeSheet(); UI.tab='orcar'; render();
  if(hasCoords) setTimeout(calcRoute,50);
  toast('Preço recalculado com seus valores atuais');
}
function cobrancaMsg(j){
  const s=S();
  return `Olá, ${firstName(j.clienteNome)}! Tudo bem? Passando para lembrar do pagamento do carreto${j.data?' de '+fmtDM(j.data):''}: ${R$(j.preco)}.${s.pix?`\nChave Pix: ${s.pix}`:''}\nObrigado!`;
}

      <button class="btn btn-outline btn-sm" style="flex:1" onclick="setStatus('${j.id}','recusado');openSemResposta()">Recusou</button></div></div>`; }).join('') || '<div class="empty">Tudo respondido.</div>'}</div>`);

function viewClientes(){
  const q=UI.clientSearch.toLowerCase();

    .map(c=>{ const js=DB.jobs.filter(j=>j.clienteId===c.id); const last=js.map(j=>j.data||j.criado).sort().pop(); const deve=js.filter(j=>j.status==='feito').reduce((a,j)=>a+j.preco,0); return {c,js,last,deve}; })
    .sort((a,b)=>(b.last||'').localeCompare(a.last||''));

function clientListHTML(pre){
  const q=UI.clientSearch.toLowerCase();
  const list = pre || DB.clients.filter(c=>!q||c.nome.toLowerCase().includes(q)||(digits(q)&&digits(c.whatsapp).includes(digits(q))))
    .map(c=>{ const js=DB.jobs.filter(j=>j.clienteId===c.id); const last=js.map(j=>j.data||j.criado).sort().pop(); const deve=js.filter(j=>j.status==='feito').reduce((a,j)=>a+j.preco,0); return {c,js,last,deve}; })

function openClient(id){

function quoteForClient(id){ const c=DB.clients.find(x=>x.id===id); newQuote({clienteId:c.id,clienteNome:c.nome,clienteWpp:c.whatsapp||''}); closeSheet(); UI.tab='orcar'; render(); }
function editClient(id){
  const c=id?DB.clients.find(x=>x.id===id):{nome:'',whatsapp:'',obs:''};
  openSheet(`<div class="sheet-head"><h2>${id?'Editar cliente':'Novo cliente'}</h2><button class="icon-btn" onclick="closeSheet()" aria-label="Fechar">${ic('x')}</button></div>

function saveClient(id){
  const nome=document.getElementById('ec-nome').value.trim(); if(!nome){ toast('Informe o nome'); return; }
  const data={nome, whatsapp:digits(document.getElementById('ec-wpp').value), obs:document.getElementById('ec-obs').value.trim()};
  if(id){ Object.assign(DB.clients.find(c=>c.id===id),data); DB.jobs.forEach(j=>{ if(j.clienteId===id) j.clienteNome=nome; }); }
  else DB.clients.push({id:uid(),criado:today(),...data});
  Store.save(); closeSheet(); render(); toast('Cliente salvo');
}
function deleteClient(id){ if(!confirm('Excluir o cliente? Os serviços dele continuam no histórico.')) return; DB.clients=DB.clients.filter(c=>c.id!==id); DB.jobs.forEach(j=>{ if(j.clienteId===id) j.clienteId=null; }); Store.save(); closeSheet(); render(); }

/* ═════════ DINHEIRO ═════════ */
function monthStats(ym){
  const recebido=DB.jobs.filter(j=>j.status==='pago' && (j.pagoEm||j.data||'').startsWith(ym)).reduce((a,j)=>a+j.preco,0);
  const gastos=DB.expenses.filter(e=>e.data.startsWith(ym)).reduce((a,e)=>a+e.valor,0);
  return {recebido, gastos, lucro:recebido-gastos};
}
function viewDinheiro(){
  const ym=UI.month, [y,m]=ym.split('-').map(Number);
  const st=monthStats(ym);
  const aReceber=DB.jobs.filter(j=>j.status==='feito');
  const ar=aReceber.reduce((a,j)=>a+j.preco,0);
  const exps=DB.expenses.filter(e=>e.data.startsWith(ym)).sort((a,b)=>b.data.localeCompare(a.data));
  const pagos=DB.jobs.filter(j=>j.status==='pago' && (j.pagoEm||j.data||'').startsWith(ym)).sort((a,b)=>(b.pagoEm||'').localeCompare(a.pagoEm||''));
  let h=`<h1 class="page-title">Dinheiro</h1>
    <div class="row"><button class="icon-btn" onclick="shiftMonth(-1)" aria-label="Mês anterior">${ic('chevL')}</button>
      <b style="text-transform:capitalize">${MONTHS[m-1]} ${y}</b>
      <button class="icon-btn" onclick="shiftMonth(1)" aria-label="Próximo mês" ${ym>=today().slice(0,7)?'disabled style="opacity:.35"':''}>${ic('chevR')}</button></div>
    <div class="card-ink"><span class="muted small">Lucro real</span><span class="value-xl num" style="color:${st.lucro<0?'#F2A193':'var(--brand)'}">${R$(st.lucro)}</span><span class="muted small">Recebido menos gastos lançados</span></div>
    <div class="card stack">
      <div class="row"><span>Recebido</span><b class="num">${R$(st.recebido)}</b></div>
      <div class="row"><span>A receber</span><b class="num" style="color:var(--orange-text)">${R$(ar)}</b></div>
      <div class="row"><span>Gastos</span><b class="num">−${R$(st.gastos)}</b></div>
    </div>
    <button class="btn btn-dark btn-block" onclick="openExpense()">${ic('plus')}Lançar gasto</button>`;
  if(aReceber.length) h+=`<div class="section-label">A receber</div><div class="stack">${aReceber.map(jobItem).join('')}</div>`;
  h+=`<div class="section-label">Gastos do mês</div>`;
  h+= exps.length?`<div class="card stack">${exps.map(e=>`<div class="row"><div><div>${esc(e.tipo)}${e.desc?' · <span class="muted">'+esc(e.desc)+'</span>':''}</div><div class="small muted">${fmtDM(e.data)}</div></div>
      <div class="row" style="gap:6px"><b class="num">−${R$(e.valor)}</b><button class="icon-btn" style="width:32px;height:32px" onclick="deleteExpense('${e.id}')" aria-label="Excluir gasto">${ic('x','width="16" height="16"')}</button></div></div>`).join('')}</div>`
    : `<div class="empty"><b>Nenhum gasto lançado</b>Lance combustível e manutenção para ver o lucro de verdade.</div>`;
  if(pagos.length) h+=`<div class="section-label">Recebidos no mês</div><div class="stack">${pagos.map(jobItem).join('')}</div>`;
  return h;
}
function shiftMonth(d){ const [y,m]=UI.month.split('-').map(Number); const dt=new Date(y,m-1+d,1); UI.month=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}`; render(); }

    <div class="section-label">Seus dados</div>
    <div class="card small muted">Os dados ficam salvos neste celular. Faça backup de vez em quando para não perder nada se trocar de aparelho.</div>
    <div class="btn-row"><button class="btn btn-outline" style="flex:1" onclick="exportBackup()">${ic('dl')}Fazer backup</button>
      <button class="btn btn-outline" style="flex:1" onclick="document.getElementById('import-file').click()">${ic('ul')}Restaurar</button></div>
    <div class="small muted" style="text-align:center;margin-top:8px">CarretoJá 2.0</div>
  </div>`);
}
let baseTimer=null;
function baseInput(v){
  clearTimeout(baseTimer);
  const box=document.getElementById('ac-base');
  if(v.trim().length<3){ box.innerHTML=''; return; }
  baseTimer=setTimeout(()=>geocode(v).then(list=>{ box.innerHTML=list.length?`<div class="ac">${list.map(f=>`<button onclick="setBase('${encodeURIComponent(f.label)}',${f.lat},${f.lng})"><b>${esc(f.line1)}</b><span>${esc(f.line2)}</span></button>`).join('')}</div>`:''; }),350);
}
function setBase(label,lat,lng){
  S().base={label:decodeURIComponent(label),lat:+lat,lng:+lng}; Store.save();
  const i=document.getElementById('base-input'); if(i) i.value=S().base.label;
  const b=document.getElementById('ac-base'); if(b) b.innerHTML='';
  if(document.getElementById('onb-next')) document.getElementById('onb-next').disabled=false;
  toast('Endereço base salvo');
}
function setTheme(v){ S().theme=v; Store.save(); applyTheme(); }
function applyTheme(){ const t=S().theme; if(t==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t;
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); document.querySelector('meta[name=theme-color]').setAttribute('content',bg||'#F7F6F2'); }
function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`carretoja-backup-${today()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('Backup salvo nos downloads');
}
document.getElementById('import-file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.settings||!Array.isArray(d.jobs)) throw 0;
      if(!confirm('Substituir os dados deste celular pelo backup?')) return;
      DB=d; DB.settings={...DEFAULT_SETTINGS,...d.settings}; DB.clients||=[]; DB.expenses||=[]; Store.save(); closeSheet(); applyTheme(); render(); toast('Backup restaurado');
    }catch(err){ toast('Arquivo de backup inválido'); } };
  rd.readAsText(f); e.target.value='';
});

/* ═════════ ONBOARDING ═════════ */
let onbStep=0;
function renderOnboarding(){
  const s=S();
  const steps=`<div class="onb-steps">${[0,1,2].map(i=>`<i class="${i<=onbStep?'on':''}"></i>`).join('')}</div>`;
  let body='';
  if(onbStep===0){
    body=`<div class="brand" style="font-size:22px"><span class="brand-mark" style="width:36px;height:36px">${ic('box')}</span>CarretoJá</div>
      <h1 class="page-title" style="font-size:30px">Orçamento justo em segundos, agenda e lucro real.</h1>
      <p class="muted">Vamos deixar o app com a sua cara. Leva menos de um minuto.</p>
      <div class="field"><label>Seu nome</label><input class="input" id="onb-nome" value="${esc(s.nome)}" placeholder="Como o cliente te chama"></div>
      <div class="field"><label>Seu WhatsApp</label><input class="input" id="onb-tel" inputmode="tel" value="${esc(s.telefone?fmtPhone(s.telefone):'')}" placeholder="(12) 99999-0000"></div>
      <div style="flex:1"></div>
      <button class="btn btn-primary btn-block" onclick="onbNext()">Continuar</button>`;
  } else if(onbStep===1){
    body=`<h1 class="page-title">Qual é o seu veículo?</h1><p class="muted">Isso já preenche consumo e desgaste. Dá para ajustar depois.</p>
      <div class="vehicles">${Object.entries(VEHICLES).map(([k,v])=>`<button class="vehicle ${s.veiculo===k?'on':''}" onclick="pickVehicle('${k}')">${ic(v.icon)}<b>${v.nome}</b><span>${v.desc}</span></button>`).join('')}</div>
      <div class="grid2">${numField('precoLitro','Preço do combustível','R$','/L')}${numField('valorHora','Quanto vale sua hora','R$','/h',1)}</div>
      <div style="flex:1"></div>
      <div class="btn-row"><button class="btn btn-ghost" onclick="onbStep=0;renderOnboarding()">Voltar</button><button class="btn btn-primary" style="flex:1" onclick="onbStep=2;renderOnboarding()">Continuar</button></div>`;
  } else {
    body=`<h1 class="page-title">De onde você sai?</h1><p class="muted">Seu endereço base vira o ponto A dos orçamentos.</p>
      <div class="stop" style="position:relative"><span class="stop-dot dot-a">A</span>
        <input class="input" id="base-input" placeholder="Rua, número, bairro" value="${esc(s.base?.label||'')}" autocomplete="off" oninput="baseInput(this.value)"><div id="ac-base"></div></div>
      <div style="flex:1"></div>
      <button class="btn btn-primary btn-block" id="onb-next" onclick="finishOnb()">Fazer meu primeiro orçamento</button>
      <button class="btn btn-ghost btn-block" onclick="finishOnb(true)">Pular por agora</button>`;
  }
  root.innerHTML=`<div class="onb">${steps}${body}</div>`;
}
function onbNext(){ const n=document.getElementById('onb-nome').value.trim(); if(!n){ toast('Informe seu nome'); return; } S().nome=n; S().telefone=digits(document.getElementById('onb-tel').value); Store.save(); onbStep=1; renderOnboarding(); }
function pickVehicle(k){ const v=VEHICLES[k]; Object.assign(S(),{veiculo:k,consumo:v.consumo,depr:v.depr}); Store.save(); renderOnboarding(); }
function finishOnb(skip){ S().onboarded=true; Store.save(); if(skip){ UI.tab='hoje'; render(); } else go('orcar',true); }

/* ═════════ PÁGINA DO CLIENTE (link do orçamento) ═════════ */
function renderClientPage(){
  let o;
  try{ const b=location.hash.slice(3).replace(/-/g,'+').replace(/_/g,'/'); o=JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){ root.innerHTML=`<div class="client-page"><div class="empty"><b>Link inválido</b>Peça um novo orçamento ao prestador.</div></div>`; return; }
  document.documentElement.dataset.theme = 'light';
  const stops=(o.s||[]);
  const hasMap=stops.length>=2 && stops.every(s=>s[1]!=null);
  const vencido = o.val && o.val < today();
  const aceite = `Olá! Aceito o orçamento #${o.id} de ${R$(o.r)}${o.d?` para ${fmtDay(o.d)}${o.h?' às '+o.h:''}`:''}. ${stops.length?'Trajeto: '+stops.map(s=>s[0]).join(' → ')+'.':''}`;
  const duvida = `Olá! Tenho uma dúvida sobre o orçamento #${o.id}.`;
  root.innerHTML=`<div class="client-page">
    <div class="brand" style="font-size:15px;color:var(--muted)"><span class="brand-mark" style="width:24px;height:24px">${ic('box')}</span>Orçamento via CarretoJá</div>
    <div><div class="eyebrow">Orçamento de</div><h1 class="page-title">${esc(o.n||'Prestador')}</h1>${o.c?`<div class="muted">Para ${esc(o.c)}</div>`:''}</div>
    ${hasMap?`<div class="map big" id="cmap"></div>`:''}
    <div class="card stack">
      <b style="font-size:18px">${esc(stops.map(s=>s[0]).join(' → ')||'Carreto')}</b>
      <div class="muted">${fmtKm(o.k)}${o.d?` · ${fmtDay(o.d)}`:''}${o.h?' · '+esc(o.h):''}</div>
      <div class="hr"></div>
      ${(o.i||[]).map(x=>`<div class="check-line">${ic('check')}<span>${esc(x)}</span></div>`).join('')}
    </div>
    <div class="card stack">
      <span class="muted small">Valor total</span>
      <span class="value-xl num">${R$(o.r)}</span>
      <span class="small ${vencido?'':'muted'}" style="${vencido?'color:var(--red-text);font-weight:600':''}">${vencido?'Orçamento vencido em '+fmtDM(o.val)+' — peça uma atualização':'Válido até '+fmtDM(o.val)}</span>
      ${o.p?`<div class="pix"><span class="small muted">Pix</span><code>${esc(o.p)}</code><button class="btn btn-outline btn-sm" onclick="navigator.clipboard?.writeText('${esc(o.p).replace(/'/g,"\\'")}').then(()=>toast('Chave Pix copiada'))">${ic('copy','width="16" height="16"')}Copiar</button></div>`:''}
    </div>
  </div>
  ${o.t?`<div class="client-cta"><a class="btn btn-green btn-block" href="${waLink(o.t,aceite)}" target="_blank" rel="noopener">${ic('check')}Aceitar e agendar</a>
    <a class="btn btn-ghost btn-block" href="${waLink(o.t,duvida)}" target="_blank" rel="noopener">Tenho uma dúvida</a></div>`:''}`;
  if(hasMap) setTimeout(()=>drawMap(document.getElementById('cmap'),null,stops.map(s=>({lat:s[1],lng:s[2]}))),30);
}

/* ═════════ sheet / toast ═════════ */
const sheet=document.getElementById('sheet'), backdrop=document.getElementById('backdrop');
function openSheet(html){ sheet.innerHTML=`<div class="sheet-grip"></div>${html}`; sheet.scrollTop=0; sheet.classList.add('open'); backdrop.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); backdrop.classList.remove('open'); }
backdrop.addEventListener('click',()=>{ closeSheet(); if(UI.tab!=='orcar') render(); });
let toastT=null;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

/* ═════════ init ═════════ */
DB = Store.load(); Store.save();
applyTheme();
window.addEventListener('hashchange',render);
render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
